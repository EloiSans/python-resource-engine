# Cloud emulators for integration tests:  docker compose -f compose.emulators.yaml up -d --build
# Then: uv run pytest -m emulator
# Open-source services with UIs: Garage (S3), RabbitMQ (:15672), Keycloak (:8180)
# and the OpenFGA playground (:3000). OPA (:8181) serves docker/opa/*.rego.
# PostgreSQL (:5439) runs the migration and SQL contract tests.
# Azure Service Bus is not included: its official emulator requires accepting
# Microsoft EULAs (emulator and SQL Server); see docs/adapters.md.
name: resource-engine-emulators

services:
  aws:
    # Official AWS Emulator, built from the recipe in the AWS user guide.
    build: docker/aws-emulator
    image: resource-engine/aws-emulator
    command: ["-p", "9297", "--auth", "off", "--telemetry", "off"]
    environment:
      EMULATOR_TELEMETRY: "off"
    ports:
      - "127.0.0.1:9297:9297"
    volumes:
      # The emulator writes its self-signed CA to <home>/.aws/emulator/9297/ca.pem
      - ./.emulators/aws:/home/emulator/.aws/emulator
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1:9297/__admin/health"]
      interval: 2s
      retries: 30

  pubsub:
    # Official Google Cloud CLI emulators image.
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=resource-engine-test"]
    ports:
      - "127.0.0.1:8085:8085"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resource_engine
      POSTGRES_PASSWORD: resource_engine
      POSTGRES_DB: resource_engine
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_engine"]
      interval: 2s
      retries: 30

  garage:
    # Garage, S3-compatible object storage (AGPL; used as a dev tool only).
    # After start: uv run python docker/garage/init.py (the S3 tests run it too).
    image: dxflrs/garage:v2.4.1
    ports:
      - "127.0.0.1:3910:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      retries: 30

  rabbitmq:
    # Management UI: http://127.0.0.1:15672 (guest / guest)
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 30

  valkey:
    # Valkey (BSD, Redis-compatible): shared rate-limit counters.
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  mailpit:
    # Catches every email: UI and API at http://127.0.0.1:8026, SMTP on :1026
    # (not the usual 1025/8025, which a Mailpit of another project may hold).
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30

  gotenberg:
    # HTML to PDF with headless Chromium (generated documents): API on :3010.
    image: gotenberg/gotenberg:8.17.3
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/health"]
      interval: 3s
      retries: 40

  azurite:
    # Azure Storage emulator: Blob on :10000 (devstoreaccount1, the well-known dev key).
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
    ports:
      - "127.0.0.1:10000:10000"

  fake-gcs:
    # Google Cloud Storage emulator (JSON API) on :4443, plain HTTP.
    image: fsouza/fake-gcs-server:1.52.2
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443"]
    ports:
      - "127.0.0.1:4443:4443"

  trino:
    # Query engine for data-lake view resources: REST on :8088, the memory catalog.
    image: trinodb/trino:476
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./docker/trino/catalog/memory.properties:/etc/trino/catalog/memory.properties:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/v1/info"]
      interval: 5s
      retries: 60

  keycloak:
    # Admin console: http://127.0.0.1:8180 (admin / admin). Realms "resource-engine",
    # "invoices" (the example app) and "partner" (a SAML IdP federated into "invoices").
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      # The image has no curl: ask the management port with bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  opa:
    # Policy decisions and the compile API (row filters); policies reload on change.
    image: openpolicyagent/opa:1.22.4
    command: ["run", "--server", "--addr=:8181", "--watch", "/policies"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./docker/opa:/policies:ro

  openfga:
    # In-memory datastore: stores and tuples are lost on restart (tests create their own).
    image: openfga/openfga:v1.22.0
    command: ["run"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3000:3000"

volumes:
  garage-meta:
  garage-data:
