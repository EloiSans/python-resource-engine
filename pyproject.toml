[project]
name = "resource-engine-workspace"
version = "0.0.0"
description = "Development workspace for the Resource Engine packages (not published)."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "adapters/*"]

[tool.uv.sources]
resource-engine = { workspace = true }
resource-engine-fastapi = { workspace = true }
resource-engine-mcp = { workspace = true }
resource-engine-sqlalchemy = { workspace = true }
resource-engine-devtools = { workspace = true }
resource-engine-aws = { workspace = true }
resource-engine-azure = { workspace = true }
resource-engine-gcp = { workspace = true }
resource-engine-http = { workspace = true }
resource-engine-sap = { workspace = true }
resource-engine-s3 = { workspace = true }
resource-engine-rabbitmq = { workspace = true }
resource-engine-oidc = { workspace = true }
resource-engine-cedar = { workspace = true }
resource-engine-opa = { workspace = true }
resource-engine-openfga = { workspace = true }
resource-engine-opentelemetry = { workspace = true }

[dependency-groups]
dev = [
    "resource-engine",
    "resource-engine-fastapi",
    "resource-engine-mcp",
    "resource-engine-sqlalchemy[alembic]",
    "resource-engine-devtools",
    "resource-engine-aws[all]",
    "resource-engine-azure[all]",
    "resource-engine-gcp[all]",
    "resource-engine-http[all]",
    "resource-engine-sap[all]",
    "resource-engine-s3",
    "resource-engine-rabbitmq",
    "resource-engine-oidc",
    "resource-engine-cedar",
    "resource-engine-opa",
    "resource-engine-openfga",
    "resource-engine-opentelemetry",
    "opentelemetry-sdk>=1.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --ignore-glob=*/ai/skill/examples/* --ignore=evals/fixture --ignore=evals/tasks"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "adapters", "examples", "evals", "scripts"]
markers = [
    "emulator(name): needs a running emulator or local service (aws, pubsub, garage, rabbitmq, keycloak, opa, openfga, postgres); skipped when it is not reachable",
]
pythonpath = ["examples"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.resource-engine]
registry = "invoices.bootstrap:registry"
authz = "invoices.bootstrap:authz"
policies = "invoices.authz:SEED_POLICIES"
metadata = "invoices.infrastructure.persistence:metadata"
paths = ["examples"]

[tool.resource-engine.asyncapi]
title = "Factures (exemple de Resource Engine)"
version = "0.1.0"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
