name: Documentation site

# The example application's functional documentation (resource-engine docs site),
# published to GitHub Pages on every push to main. Needs Settings → Pages →
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy to Pages
  id-token: write # verify the deployment comes from this workflow

concurrency:
  group: pages
  cancel-in-progress: false # never stop a deployment halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: The documentation is complete
        run: uv run resource-engine docs validate --strict
      - name: Build the site from the example (pyproject [tool.resource-engine])
        run: uv run resource-engine docs site --out site --title "Resource Engine · exemple de factures"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
