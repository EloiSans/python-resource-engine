[project]
name = "resource-engine-fastapi"
version = "0.1.0.dev0"
description = "FastAPI HTTP adapter for Resource Engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "fastapi>=0.110", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_fastapi"]
