[project]
name = "resource-engine"
version = "0.1.0.dev0"
description = "Declarative resource engine for business backends: resources, lifecycle hooks, state machines, ports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "python-statemachine>=3.0"]

[project.optional-dependencies]
testing = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine"]
