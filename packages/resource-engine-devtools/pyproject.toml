[project]
name = "resource-engine-devtools"
version = "0.1.0.dev0"
description = "Functional documentation, inspection and verification CLI for Resource Engine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["resource-engine>=0.1.0.dev0,<0.2", "docstring-parser>=0.16"]

[project.urls]
Homepage = "https://github.com/EloiSans/python-resource-engine"
Documentation = "https://github.com/EloiSans/python-resource-engine/tree/main/docs"
Source = "https://github.com/EloiSans/python-resource-engine/tree/main/packages/resource-engine-devtools"
Issues = "https://github.com/EloiSans/python-resource-engine/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_devtools"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
resource-engine = "resource_engine_devtools.cli:main"
