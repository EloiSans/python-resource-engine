[project]
name = "resource-engine-devtools"
version = "0.1.0.dev0"
description = "Functional documentation, inspection and verification CLI for Resource Engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "docstring-parser>=0.16"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_devtools"]

[project.scripts]
resource-engine = "resource_engine_devtools.cli:main"
