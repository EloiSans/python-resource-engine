[project]
name = "resource-engine-sqlalchemy"
version = "0.1.0.dev0"
description = "SQLAlchemy persistence adapter (repositories and unit of work) for Resource Engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "sqlalchemy[asyncio]>=2.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_sqlalchemy"]
