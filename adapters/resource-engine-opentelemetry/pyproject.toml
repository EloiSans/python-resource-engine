[project]
name = "resource-engine-opentelemetry"
version = "0.1.0.dev0"
description = "OpenTelemetry for Resource Engine: tracing from operation to consumer, and consumer metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "opentelemetry-api>=1.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_opentelemetry"]
