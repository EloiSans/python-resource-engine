[project]
name = "resource-engine-cedar"
version = "0.1.0.dev0"
description = "Cedar policies for Resource Engine: an in-process PolicyEngine on cedarpy, with row filters from partial evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "cedarpy>=4.12"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_cedar"]
