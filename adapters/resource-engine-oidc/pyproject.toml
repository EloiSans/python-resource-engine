[project]
name = "resource-engine-oidc"
version = "0.1.0.dev0"
description = "OIDC/JWT authentication for Resource Engine: Keycloak, Amazon Cognito, Microsoft Entra ID, Google Identity Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "httpx>=0.27", "PyJWT[crypto]>=2.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_oidc"]
