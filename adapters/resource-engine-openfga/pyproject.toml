[project]
name = "resource-engine-openfga"
version = "0.1.0.dev0"
description = "OpenFGA relationships for Resource Engine: checks, row filters from list-objects, tuple sync."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "openfga-sdk>=0.10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_openfga"]
