[project]
name = "resource-engine-s3"
version = "0.1.0.dev0"
description = "S3-compatible blob store for Resource Engine documents (AWS S3, Garage, MinIO, Ceph, R2)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "aiobotocore>=2.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_s3"]
