[project]
name = "resource-engine-azure"
version = "0.1.0.dev0"
description = "Azure adapters for Resource Engine (Service Bus message publisher)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine"]

[project.optional-dependencies]
servicebus = ["azure-servicebus>=7.12"]
all = ["azure-servicebus>=7.12"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_azure"]
