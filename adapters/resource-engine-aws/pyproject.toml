[project]
name = "resource-engine-aws"
version = "0.1.0.dev0"
description = "AWS adapters for Resource Engine: SQS publisher and consumer source, SNS publisher, SES email sender."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["resource-engine>=0.1.0.dev0,<0.2"]

[project.optional-dependencies]
sqs = ["aiobotocore>=2.13"]
sns = ["aiobotocore>=2.13"]
ses = ["aiobotocore>=2.13"]
all = ["aiobotocore>=2.13"]

[project.urls]
Homepage = "https://github.com/EloiSans/python-resource-engine"
Documentation = "https://github.com/EloiSans/python-resource-engine/tree/main/docs"
Source = "https://github.com/EloiSans/python-resource-engine/tree/main/adapters/resource-engine-aws"
Issues = "https://github.com/EloiSans/python-resource-engine/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_aws"]
