[project]
name = "resource-engine-aws"
version = "0.1.0.dev0"
description = "AWS adapters for Resource Engine: SQS publisher and consumer source, SNS publisher."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine"]

[project.optional-dependencies]
sqs = ["aiobotocore>=2.13"]
sns = ["aiobotocore>=2.13"]
all = ["aiobotocore>=2.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_aws"]
