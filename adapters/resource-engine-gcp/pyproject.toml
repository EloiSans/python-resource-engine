[project]
name = "resource-engine-gcp"
version = "0.1.0.dev0"
description = "Google Cloud adapters for Resource Engine: Pub/Sub publisher, pull source and push decoder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine"]

[project.optional-dependencies]
pubsub = ["google-cloud-pubsub>=2.21"]
all = ["google-cloud-pubsub>=2.21"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_gcp"]
