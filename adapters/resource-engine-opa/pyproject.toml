[project]
name = "resource-engine-opa"
version = "0.1.0.dev0"
description = "Open Policy Agent (Rego) for Resource Engine: decisions over the REST API, row filters from the compile API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["resource-engine", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_engine_opa"]
